<!DOCTYPE html>
<!-- i just want to `code` -->
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090d22">
<title>22</title>
<meta name="description" content="A Year of Woven Dreams">
<style>
html{background:transparent}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --i:cubic-bezier(.4,0,1,1);--x:cubic-bezier(.16,1,.3,1);
  --e:cubic-bezier(.4,0,.2,1);--o:cubic-bezier(.22,1,.36,1);
  --bg-dark:#090d22;--bg-mid:#141830;
  --hi:rgba(255,255,255,.92);--lo:rgba(255,255,255,.08);--accent:rgba(91,110,245,.25);
  --emboss:0 -1px 0 rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.04);--halo:0 0 6px var(--bg-dark),0 0 2px var(--bg-dark),0 0 10px var(--bg-dark),0 0 16px rgba(9,13,34,.90);
}
body{
  font-family:'SF Mono','Courier New',monospace;
  background:linear-gradient(145deg,var(--bg-dark),var(--bg-mid));
  display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;
}

#particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;transition:z-index 0s linear .200s}
.pt{position:absolute;background:rgba(255,255,255,.55);border-radius:50%;pointer-events:none;will-change:transform,opacity;backface-visibility:hidden}

#loader{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;opacity:0;contain:layout style;transition:opacity .524s var(--o)}
#loader.loader-active{opacity:1}
#loader.hidden{opacity:0!important;pointer-events:none;transition:none}
#date{font-size:26px;font-weight:500;color:var(--hi);letter-spacing:4px;margin-bottom:26px;font-variant-numeric:tabular-nums;text-align:center;text-shadow:0 0 18px var(--accent);opacity:0;transform:translateY(10px);transition:opacity .524s var(--o),transform .524s var(--o)}
#date.warp  {animation:spaceWarp 3.589s ease-in-out infinite}
#date.settle{animation:hologramSettle 3.589s var(--e)}
#date.arrival{animation:arrivalSettle 1.372s var(--o) infinite}
#date.special{animation:none}
@keyframes spaceWarp{
  0%,100%{letter-spacing:4px;   text-shadow:0 0 18px rgba(91,110,245,.45),0 0 36px rgba(91,110,245,.20)}
  30%    {letter-spacing:4.3px; text-shadow:0 0 22px rgba(110,155,255,.55),0 0 44px rgba(110,155,255,.25),1px 0 0 rgba(110,155,255,.25),-1px 0 0 rgba(255,110,140,.15)}
  60%    {letter-spacing:3.85px;text-shadow:0 0 20px rgba(120,175,255,.50),0 0 40px rgba(120,175,255,.22)}
  80%    {letter-spacing:4.15px;text-shadow:0 0 24px rgba(91,140,255,.52),0 0 46px rgba(91,140,255,.26),-1px 0 0 rgba(110,155,255,.20),1px 0 0 rgba(255,110,140,.12)}
}
@keyframes hologramSettle{
  from{letter-spacing:4.2px;text-shadow:0 0 22px rgba(110,155,255,.50),0 0 44px rgba(110,155,255,.25)}
  to  {letter-spacing:4px;  text-shadow:0 0 18px rgba(91,110,245,.35),0 0 36px rgba(91,110,245,.15)}
}
@keyframes arrivalSettle{
  0%  {letter-spacing:4px;   text-shadow:0 0 18px rgba(91,110,245,.35),0 0 36px rgba(91,110,245,.15)}
  10% {letter-spacing:4.5px; text-shadow:0 0 10px rgba(255,255,255,.65),0 0 26px rgba(155,195,255,.62),0 0 58px rgba(91,128,255,.50),0 0 108px rgba(91,110,245,.26)}
  28% {letter-spacing:4.3px; text-shadow:0 0 8px rgba(255,255,255,.45),0 0 22px rgba(135,180,255,.48),0 0 50px rgba(91,120,255,.36),0 0 90px rgba(91,110,245,.18)}
  62% {letter-spacing:4.12px;text-shadow:0 0 5px rgba(255,255,255,.28),0 0 18px rgba(115,160,255,.36),0 0 40px rgba(91,115,255,.26),0 0 72px rgba(91,110,245,.13)}
  100%{letter-spacing:4px;   text-shadow:0 0 18px rgba(91,110,245,.35),0 0 36px rgba(91,110,245,.15)}
}
.bar-wrap{position:relative;width:288px;opacity:0;transform:translateY(10px);transition:opacity .524s var(--o) .124s,transform .524s var(--o) .124s}
#loader.loader-entered #date{opacity:1;transform:translateY(0)}
#loader.loader-entered .bar-wrap{opacity:1;transform:translateY(0)}
.bar{width:288px;height:2px;background:var(--lo);border-radius:10px;position:relative;overflow:hidden;contain:layout style;box-shadow:0 1px 0 rgba(255,255,255,.05),0 -1px 0 rgba(0,0,0,.4)}
#morse-bg{position:absolute;inset:0;display:flex;align-items:center;z-index:1}
#bar-overlay{position:absolute;inset:0 auto 0 0;width:0%;background:transparent;z-index:2;overflow:hidden;will-change:width;transform:translateZ(0)}
#morse-fg{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;height:100%;white-space:nowrap}
.morse-dot,.morse-dash{height:2px;flex-shrink:0}
.morse-dot{border-radius:50%}
.morse-dash{border-radius:2px}
.morse-gap{flex-shrink:0}
#morse-bg .morse-dot,#morse-bg .morse-dash{background:rgba(255,255,255,.10)}
#morse-fg .morse-dot,#morse-fg .morse-dash{background:rgba(255,255,255,.88);box-shadow:0 0 4px rgba(91,110,245,.40)}
#bar-cursor{position:absolute;top:-2px;width:2px;height:6px;background:rgba(200,215,255,.85);box-shadow:0 0 6px rgba(91,110,245,.65),0 0 12px rgba(91,110,245,.28);border-radius:1px;pointer-events:none;z-index:5;opacity:0;will-change:left,opacity;transform:translateZ(0)}

#splash{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:10;opacity:0;pointer-events:none;will-change:opacity;transform:translateZ(0)}
#splash.visible{pointer-events:auto;touch-action:none}
.splash-inner{text-align:center;width:100%;max-width:466px;position:relative;z-index:10;opacity:0;transform:translateY(16px);transition:opacity .524s var(--o),transform .524s var(--o)}
.splash-inner.visible{opacity:1;transform:translateY(0)}
.digits{display:flex;gap:16px;justify-content:center;margin-bottom:68px;transition:opacity .524s var(--e),scale .848s var(--o),filter .848s var(--o)}
.digit{position:relative;width:84px;height:136px}
.seg{
  position:absolute;
  background:linear-gradient(168deg,#1a2038 0%,#121830 38%,#0c1022 100%);
  opacity:0;cursor:grab;user-select:none;touch-action:none;
  border:1px solid rgba(120,140,255,.10);
  border-top-color:rgba(190,205,255,.16);
  border-bottom-color:rgba(0,0,0,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 0 0 1px rgba(255,255,255,.015),inset 0 -2px 4px rgba(0,0,0,.45),inset 0 6px 10px -6px rgba(140,160,255,.07),0 1px 2px rgba(0,0,0,.55),0 4px 6px rgba(0,0,0,.38),0 6px 16px rgba(0,0,0,.22);
  border-radius:4px;will-change:transform;contain:layout style;backface-visibility:hidden;
  transition:border-color .20s var(--e),box-shadow .20s var(--e);
}
.seg:hover{border-color:rgba(91,110,245,.26);border-top-color:rgba(200,215,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 0 0 1px rgba(255,255,255,.02),inset 0 -2px 4px rgba(0,0,0,.45),inset 0 6px 10px -6px rgba(140,160,255,.10),0 1px 2px rgba(0,0,0,.55),0 4px 6px rgba(0,0,0,.38),0 0 16px rgba(91,110,245,.12)}
.seg.dragging{cursor:grabbing;z-index:1000;border-color:rgba(91,110,245,.34);border-top-color:rgba(200,215,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 4px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.45),0 16px 26px rgba(0,0,0,.55),0 26px 42px rgba(0,0,0,.30),0 0 16px rgba(91,110,245,.14);transition:none}
.seg.loaded{animation:segPowerOn 1.372s var(--o) 1 both}
@keyframes segPowerOn{0%{opacity:0;transform:scale(.95)}40%{opacity:.35;transform:scale(1.006)}70%{opacity:.72}100%{opacity:1;transform:scale(1)}}
.seg.on.loaded{animation:segPowerOnGlow 1.372s var(--e) 1 both}
@keyframes segPowerOnGlow{0%{opacity:0;transform:scale(.92)}35%{opacity:.30;transform:scale(1.008)}65%{opacity:.72;transform:scale(1.003)}100%{opacity:1;transform:scale(1)}}
.seg.on{background:linear-gradient(160deg,#7dcfff 0%,#4eaaff 30%,#3190f0 70%,#2e7ee8 100%);opacity:0;border-color:rgba(160,210,255,.22);border-top-color:rgba(230,245,255,.55);border-bottom-color:rgba(20,70,150,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.60),inset 0 6px 10px -6px rgba(255,255,255,.28),inset 0 -2px 4px rgba(10,50,130,.40),0 1px 2px rgba(10,40,100,.45),0 4px 10px rgba(40,120,230,.28),0 0 16px rgba(60,150,255,.14);transition:filter .324s var(--e),border-color .200s var(--e),box-shadow .200s var(--e)}
.seg.on::after{content:'';position:absolute;inset:-8px;border-radius:12px;background:radial-gradient(ellipse at 38% 25%,rgba(100,195,255,.05) 0%,transparent 60%);pointer-events:none;opacity:.75}
body.modal-open .seg{animation-play-state:paused}
.seg.on.theta-home{animation:thetaHeart 1.372s ease-in-out infinite;transition:none}
@keyframes thetaHeart{
  0%   {filter:hue-rotate(0deg)  brightness(1)   }
  8%   {filter:hue-rotate(38deg) brightness(1.12)}
  16%  {filter:hue-rotate(8deg)  brightness(1.03)}
  24%  {filter:hue-rotate(28deg) brightness(1.08)}
  36%  {filter:hue-rotate(0deg)  brightness(1)   }
  100% {filter:hue-rotate(0deg)  brightness(1)   }
}
@keyframes segLockFlash{
  0%  {border-color:rgba(140,190,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 4px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.5),0 3px 7px rgba(0,0,0,.28),0 0 12px rgba(91,150,255,.35)}
  100%{border-color:rgba(255,255,255,.04)}
}
.seg.locked{animation:segLockFlash .200s var(--o) both}

#modal{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;pointer-events:none}
#modal-backdrop{position:absolute;inset:0;background:rgba(4,7,20,.80);contain:strict;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:translateZ(0);will-change:opacity;transition:opacity .524s var(--e)}
#modal.open{pointer-events:auto}
#modal.open #modal-backdrop{opacity:1}
#modal-card{position:relative;z-index:2;width:min(466px,90vw);background:linear-gradient(160deg,#070a1a 0%,#0b0f22 60%,#0d1228 100%);border:1px solid rgba(91,110,245,.28);border-top-color:rgba(170,190,255,.38);border-bottom-color:rgba(0,0,0,.6);overflow:hidden;contain:layout style;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.02),0 0 0 1px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.45),0 32px 80px rgba(0,0,0,.70),0 0 80px rgba(91,110,245,.12);opacity:0;transform:translateY(16px) scale(.982);will-change:transform,opacity;transition:opacity .524s var(--o),transform .524s var(--o),border-color .324s var(--e)}
#modal.open #modal-card{opacity:1;transform:translateY(0) scale(1)}
#modal-card::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:4px;overflow:hidden;opacity:0;will-change:opacity;transform:translateZ(0);transition:opacity .524s var(--o),filter .324s var(--e);background:radial-gradient(ellipse 55% 40% at 15% 20%,rgba(91,110,245,.07) 0%,transparent 70%),radial-gradient(ellipse 40% 35% at 88% 75%,rgba(77,163,255,.06) 0%,transparent 65%),radial-gradient(ellipse 30% 25% at 72% 12%,rgba(140,100,255,.04) 0%,transparent 60%),radial-gradient(circle 1px at 8% 12%,rgba(255,255,255,.30) 0%,transparent 100%),radial-gradient(circle 1px at 23% 44%,rgba(200,215,255,.22) 0%,transparent 100%),radial-gradient(circle 1px at 38% 8%,rgba(255,255,255,.18) 0%,transparent 100%),radial-gradient(circle 1px at 55% 31%,rgba(200,215,255,.25) 0%,transparent 100%),radial-gradient(circle 1px at 67% 56%,rgba(255,255,255,.20) 0%,transparent 100%),radial-gradient(circle 1px at 80% 18%,rgba(200,215,255,.28) 0%,transparent 100%),radial-gradient(circle 1px at 91% 42%,rgba(255,255,255,.16) 0%,transparent 100%),radial-gradient(circle 1px at 14% 68%,rgba(200,215,255,.20) 0%,transparent 100%),radial-gradient(circle 1px at 44% 79%,rgba(255,255,255,.18) 0%,transparent 100%),radial-gradient(circle 1px at 76% 85%,rgba(200,215,255,.22) 0%,transparent 100%),radial-gradient(circle 1px at 30% 92%,rgba(255,255,255,.14) 0%,transparent 100%),radial-gradient(circle 1px at 62% 95%,rgba(200,215,255,.16) 0%,transparent 100%),radial-gradient(circle 1px at 5% 82%,rgba(255,255,255,.18) 0%,transparent 100%),radial-gradient(circle 1px at 88% 92%,rgba(200,215,255,.20) 0%,transparent 100%),radial-gradient(circle 1.5px at 50% 22%,rgba(180,200,255,.22) 0%,transparent 100%),radial-gradient(circle 1.5px at 18% 55%,rgba(255,255,255,.18) 0%,transparent 100%),radial-gradient(circle 1.5px at 84% 60%,rgba(180,200,255,.20) 0%,transparent 100%)}
#modal.open #modal-card::before{opacity:1}
#modal-card.theta-special{border-color:rgba(120,80,255,.32)}
#modal-card.theta-special::before{filter:hue-rotate(200deg) saturate(1.4)}
#modal-card.theta-special .mc-corner{border-color:rgba(120,80,255,.60)}
#modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 26px 16px;border-bottom:1px solid rgba(255,255,255,.06);position:relative;z-index:1}
#modal-header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(91,110,245,.50) 15%,rgba(120,150,255,.90) 50%,rgba(91,110,245,.50) 85%,transparent 100%);pointer-events:none}
#modal-label,#modal-counter,#modal-close{opacity:0;transform:translateY(-4px);transition:opacity .200s var(--o),transform .324s var(--o)}
#modal.open #modal-label  {opacity:1;transform:translateY(0);transition-delay:.200s}
#modal.open #modal-counter{opacity:1;transform:translateY(0);transition-delay:.324s}
#modal.open #modal-close  {opacity:1;transform:translateY(0);transition-delay:.524s,.524s,0s,0s}
#modal-label{font-size:10px;letter-spacing:6px;color:rgba(190,205,255,.92);text-transform:uppercase}
#modal-counter{font-size:10px;letter-spacing:4px;color:rgba(185,200,255,.80)}
#modal-counter .inf-sym{font-size:16px;line-height:1;vertical-align:middle}
#modal-label::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(77,210,140,.75);box-shadow:0 0 5px rgba(77,210,140,.55);margin:0 9px 0 0;vertical-align:middle;animation:statusBlink 3.589s ease-in-out infinite}
@keyframes statusBlink{0%,100%{opacity:1}50%{opacity:.28}}
#modal-close{background:none;border:none;cursor:pointer;padding:4px;color:rgba(205,215,255,.80);font-size:16px;line-height:1;font-family:inherit;text-shadow:var(--emboss);transition:opacity .200s var(--o),transform .324s var(--o),color .200s var(--e),filter .124s var(--e)}
#modal-close:hover {color:#fff}
#modal-close:active{filter:opacity(.55)}
#modal-body{padding:26px 26px 26px;min-height:162px;position:relative;overflow:hidden;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.10) 100%);box-shadow:inset 0 4px 10px rgba(0,0,0,.50),inset 0 1px 0 rgba(0,0,0,.60),inset 0 -1px 0 rgba(255,255,255,.04)}
#modal-body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.012) 3px,rgba(255,255,255,.012) 4px);pointer-events:none;z-index:0}
#modal-body::after{content:'';position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(91,110,245,.30) 15%,rgba(140,180,255,.85) 50%,rgba(91,110,245,.30) 85%,transparent 100%);opacity:0;pointer-events:none;z-index:5}
#modal-body.sweeping::after{animation:panelSweep .324s var(--e) .124s forwards}
@keyframes panelSweep{0%{transform:translateY(0);opacity:0}12%{opacity:1}86%{opacity:.40}100%{transform:translateY(158px);opacity:0}}
#modal-inner{display:flex;flex-direction:column;gap:10px}
#modal-inner.data-out{animation:dataOut .124s var(--i) both}
#modal-inner.data-in {animation:dataIn  .324s var(--o) both}
@keyframes dataOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-5px)}}
@keyframes dataIn {from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#modal-inner.data-in #modal-seg-id{animation:lineIn .200s var(--o) .000s both}
#modal-inner.data-in #modal-title  {animation:lineIn .324s var(--o) .076s both}
#modal-inner.data-in #modal-text   {animation:lineIn .324s var(--o) .200s both}
@keyframes lineIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
#modal.open #modal-inner{animation:none}
#modal-inner.modal-entering #modal-seg-id {animation:lineIn .324s var(--o) .200s both}
#modal-inner.modal-entering #modal-title  {animation:lineIn .324s var(--o) .324s both}
#modal-inner.modal-entering #modal-text   {animation:lineIn .324s var(--o) .524s both}
#modal-seg-id{font-size:10px;letter-spacing:4px;color:rgba(140,170,255,.95)}
#modal-seg-id::before{content:'//';margin-right:6px;opacity:.40;letter-spacing:1px}
#modal-title {font-size:21px;letter-spacing:3px;color:#f2f6ff}
#modal-title:empty{display:none}
#modal-text  {font-size:13px;letter-spacing:.5px;line-height:1.85;color:rgba(214,223,247,.86);transition:opacity .200s var(--e)}

#modal-text .hot{position:relative;display:inline-block;cursor:pointer;outline:none;color:rgba(232,238,255,.98);-webkit-tap-highlight-color:transparent;padding:0 2px;margin:0 -2px;animation:hotGlow 3.589s ease-in-out infinite;transition:color .324s var(--e),text-shadow .324s var(--e),opacity .124s var(--e)}
#modal-text .hot:hover,#modal-text .hot:focus-visible{color:#fff;animation:none;text-shadow:0 0 14px rgba(140,165,255,.55),0 0 34px rgba(100,135,255,.26)}
#modal-text .hot:active{opacity:.55}
@keyframes hotGlow{0%,100%{text-shadow:0 0 6px rgba(140,165,255,.16),0 0 14px rgba(100,135,255,.07)}50%{text-shadow:0 0 10px rgba(140,165,255,.40),0 0 24px rgba(100,135,255,.17)}}

#modal-text .sc-r{display:block;white-space:pre}
#modal-text .sc-c{display:inline-block;width:var(--cw,auto);vertical-align:top;transition:color .324s var(--e),opacity .324s var(--e)}
#modal-text .sc-c.on{color:rgba(150,182,255,.95);opacity:.618}
#modal-divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(91,110,245,.18) 20%,rgba(120,150,255,.28) 50%,rgba(91,110,245,.18) 80%,transparent);transform:scaleX(0);transform-origin:left center;transition:transform .524s var(--o)}
.mc-corner{position:absolute;width:10px;height:10px;border-color:rgba(91,110,245,.55);border-style:solid;z-index:20;pointer-events:none;opacity:0;transition:opacity .524s var(--o),border-color .324s var(--e)}
#modal.open .mc-corner{opacity:1}
.mc-tl{top:-1px;   left:-1px;  border-width:1.5px 0 0 1.5px}
.mc-tr{top:-1px;   right:-1px; border-width:1.5px 1.5px 0 0}
.mc-bl{bottom:-1px;left:-1px;  border-width:0 0 1.5px 1.5px}
.mc-br{bottom:-1px;right:-1px; border-width:0 1.5px 1.5px 0}
#modal-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 26px 16px;border-top:1px solid rgba(255,255,255,.06);opacity:0;transform:translateY(5px);transition:opacity .324s var(--o),transform .324s var(--o);position:relative;z-index:1}
#modal.open #modal-nav{opacity:1;transform:translateY(0);transition-delay:.524s}
#modal-nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(91,110,245,.20) 30%,rgba(91,110,245,.20) 70%,transparent);pointer-events:none}
.nav-btn{background:none;border:none;border-radius:2px;color:rgba(205,218,255,.92);font-family:inherit;font-size:10px;letter-spacing:4px;padding:10px 0;white-space:nowrap;cursor:pointer;text-shadow:var(--emboss);transition:color .200s var(--e),opacity .200s var(--e)}
#modal-prev{padding-right:10px}
#modal-next{padding-left:10px}
.nav-btn:hover   {color:#fff}
.nav-btn:active  {opacity:.60}
.nav-btn:disabled{opacity:.236;cursor:not-allowed}
#modal-dots{display:flex;gap:4px;align-items:center}
.modal-dot{width:4px;height:4px;border-radius:2px;background:rgba(91,110,245,.28);flex-shrink:0;transition:width .324s var(--o),background .200s var(--e),box-shadow .200s var(--e),opacity .200s var(--e)}
.modal-dot.active   {width:16px;background:linear-gradient(180deg,rgba(160,185,255,.95),rgba(100,135,255,.75));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 6px rgba(91,110,245,.40)}
.modal-dot.available{background:rgba(91,110,245,.38);box-shadow:inset 0 1px 2px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.05)}

#modal-card{--ac:91,110,245}
#modal-spec{display:none;flex:1;justify-content:space-between;gap:16px;padding:10px 0;font-size:10px;letter-spacing:4px;color:rgba(205,218,255,.92);text-shadow:var(--emboss)}
#modal.single #modal-spec{display:flex}
#modal.single #modal-prev,#modal.single #modal-dots,#modal.single #modal-next{display:none}

'use strict';

const Shared = (() => {
  const MORSE_CODE = '−•|•−|−••|••|•−|−−−|−•−|−|•−|•••−|••|•−|−•|••|•−•';
  const BAR_WIDTH = 288, PARTICLE_N = 22, TOTAL_MS = 11000, TRANSITION_MS = 3589;
  const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const START_DATE = new Date('2004-10-29'), END_DATE = new Date('2026-10-29');
  const TOTAL_DAYS = (END_DATE - START_DATE) / 86400000 | 0;
  const START_MS = START_DATE.getTime();
  const REF_MS = 1000 / 60, clock = { k: 1 };
  const tickK = (o, ts, ref = REF_MS) => { const k = o.kt ? Math.min((ts - o.kt) / ref, 3) : 1; o.kt = ts; return Math.abs(k - 1) < .08 ? 1 : k; };
  const damp = (r, k) => k === 1 ? r : 1 - Math.pow(1 - r, k);
  const fmtUTC = d => `${String(d.getUTCDate()).padStart(2, '0')} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  const END_STR = fmtUTC(END_DATE);
  const SPECIAL_DATE = new Date('2021-01-27');
  const SPECIAL_IDX = (SPECIAL_DATE - START_DATE) / 86400000 | 0;
  const TAP_MAX_MS = 200, TAP_MAX_MOVE_SQ = 36;
  const EASE_STD = 'cubic-bezier(.4,0,.2,1)', EASE_OUT_BACK = 'cubic-bezier(.22,1,.36,1)', EASE_SHARP_IN = 'cubic-bezier(.4,0,1,1)';
  const DUR_XS = 124, DUR_SM = 200, DUR_MD = 324, DUR_LG = 524, DUR_XL = 848;

  const screen = {
    w: window.innerWidth, h: window.innerHeight,
    get cx() { return this.w / 2; }, get cy() { return this.h / 2; },
  };
  const DATE_CACHE_EMPTY = -1;
  let lastDay = DATE_CACHE_EMPTY, lastDateStr = '';

  const byId = id => document.getElementById(id);
  const ease = t => t * t * (3 - 2 * t);
  const cubicInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const hx = v => ((v * 255 + .5) | 0).toString(16).padStart(2, '0');
  const rnd = (v, p = 100) => (v * p | 0) / p;
  const setTf = (el, x, y, r) => { el.style.transform = `translate(${rnd(x)}px,${rnd(y)}px) rotate(${rnd(r)}deg)`; };
  const syncPt = (el, x, y, r) => { if (!el.pt) el.pt = [x, y, r]; else { el.pt[0] = x; el.pt[1] = y; el.pt[2] = r; } };

  class DotParticle {
    constructor(container) {
      this.el = document.createElement('div');
      this.el.className = 'pt';
      container.appendChild(this.el);
      this.el.style.cssText = 'left:0;top:0';
    }
    destroy() { this.el.remove(); }
  }

  const createPerlin = () => {
    const seed = new Uint8Array(256);
    for (let i = 0; i < 256; i++) seed[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.random() * (i + 1) | 0; const t = seed[i]; seed[i] = seed[j]; seed[j] = t; }
    const perm = new Uint8Array(512);
    for (let i = 0; i < 256; i++) perm[i] = perm[i + 256] = seed[i];
    const noise = x => {
      const X = Math.floor(x) & 255; x -= Math.floor(x);
      const u = x * x * x * (x * (x * 6 - 15) + 10);
      const g0 = (perm[X] & 1) ? x : -x;
      const g1 = (perm[X + 1] & 1) ? x - 1 : -(x - 1);
      return (g0 + u * (g1 - g0)) * .5 + .5;
    };
    return { noise };
  };
  const perlin = createPerlin();

  const journey = t => {
    if (t <= 0) return 0; if (t >= 1) return 1;
    const ta = t ** 3; return ta / (ta + (1 - t) ** 4);
  };
  const jProgress = elapsed => journey(Math.min(elapsed / TOTAL_MS, 1));
  const dayAt = elapsed => TOTAL_DAYS * jProgress(elapsed);
  const jSpeed = t => { const dx = 5e-4; return (journey(Math.min(t + dx, 1)) - journey(Math.max(t - dx, 0))) / (dx * 2); };
  const particleSpeed = elapsed => { const t = Math.min(elapsed / TOTAL_MS, 1); return .2 + Math.min(Math.abs(jSpeed(t)) / .55, 1) * 35; };
  const fmtDate = d => {
    const day = d | 0;
    if (day === lastDay) return lastDateStr;
    lastDay = day;
    return lastDateStr = fmtUTC(new Date(START_MS + day * 86400000));
  };
  const resetDateCache = () => { lastDay = DATE_CACHE_EMPTY; };

  const dom = {
    date: byId('date'), barOverlay: byId('bar-overlay'), barCursor: byId('bar-cursor'),
    loader: byId('loader'), splash: byId('splash'), particles: byId('particles'),
  };

  return {
    MORSE_CODE, BAR_WIDTH, PARTICLE_N, TOTAL_MS, TRANSITION_MS,
    TOTAL_DAYS, END_STR, SPECIAL_IDX,
    TAP_MAX_MS, TAP_MAX_MOVE_SQ,
    EASE_STD, EASE_OUT_BACK, EASE_SHARP_IN, DUR_XS, DUR_SM, DUR_MD, DUR_LG, DUR_XL,
    screen, dom,
    byId, ease, cubicInOut, hx, rnd, setTf, syncPt, REF_MS, clock, tickK, damp,
    DotParticle, perlin,
    journey, dayAt, particleSpeed,
    fmtDate, resetDateCache,
  };
})();

const StartPhase = (() => {
  const { byId } = Shared;
  const initCosmos = () => {
    const canvas = byId('cosmos');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, raf = null, active = false, burstStartTs = null, lastShoot = -4000;
    const shooters = [];
    const STAR_COUNT = 90;
    const COLORS = ['#c8d8ff', '#aabfff', '#ffffff', '#ffeedd', '#d4e8ff'];
    const stars = Array.from({ length: STAR_COUNT }, () => ({
      x: Math.random(), y: Math.random(), r: .3 + Math.random() * 1.4,
      baseOp: .15 + Math.random() * .75, curOp: 0,
      bOff: Math.random() * Math.PI * 2, bSpd: .3 + Math.random() * 1.0,
      col: COLORS[Math.floor(Math.random() * 5)],
      delay: Math.random() * 2200,
    }));
    const easeOut = t => 1 - Math.pow(1 - Math.min(t, 1), 3);
    const resize = () => { W = canvas.width = canvas.offsetWidth * devicePixelRatio; H = canvas.height = canvas.offsetHeight * devicePixelRatio; ctx.clearRect(0, 0, W, H); };
    const _tail = { x: 0, y: 0 };

    const spawnShooter = () => {
      const angle = (Math.random() * 25 + 5) * Math.PI / 180, speed = W * .0013 + Math.random() * W * .0008;
      shooters.push({ x: Math.random() * W * .7, y: Math.random() * H * .4, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, len: 50 + Math.random() * 70, op: 0, life: 0, maxLife: 50 + Math.random() * 25, speed });
    };

    const getShooterGradient = (sh, tail) => {
      const gr = ctx.createLinearGradient(tail.x, tail.y, sh.x, sh.y);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(.6, `rgba(180,210,255,${(0.12 * sh.op * 1000 | 0) / 1000})`);
      gr.addColorStop(1, `rgba(255,255,255,${(0.55 * sh.op * 1000 | 0) / 1000})`);
      return gr;
    };

    const burst = () => {
      active = true; burstStartTs = performance.now();
      stars.forEach(s => { s.curOp = 0; });
      setTimeout(() => { active = false; }, Shared.TRANSITION_MS);
      if (raf === null) raf = requestAnimationFrame(draw);
    };

    const draw = now => {
      const t = now * .001, ck = Shared.tickK(draw, now), dpr = devicePixelRatio;
      ctx.clearRect(0, 0, W, H);
      const elapsed = burstStartTs ? now - burstStartTs : 0, fadingOut = !active;
      let starsVisible = 0;
      for (const s of stars) {
        const inT = Math.max(0, elapsed - s.delay) / 1200;
        const targetOp = fadingOut ? 0 : easeOut(inT) * s.baseOp;
        s.curOp += (targetOp - s.curOp) * Shared.damp(fadingOut ? .018 : .035, ck);
        if (s.curOp < .005) continue;
        starsVisible++;
        ctx.globalAlpha = s.curOp * (0.6 + 0.4 * Math.sin(t * s.bSpd + s.bOff));
        ctx.fillStyle = s.col;
        ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r * dpr, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (!fadingOut && now - lastShoot > Shared.TRANSITION_MS) { spawnShooter(); lastShoot = now; }
      for (let i = shooters.length - 1; i >= 0; i--) {
        const sh = shooters[i];
        sh.x += sh.vx * ck; sh.y += sh.vy * ck; sh.life += ck;
        sh.op = sh.life < 8 ? sh.life / 8 : sh.life > sh.maxLife - 10 ? (sh.maxLife - sh.life) / 10 : 1;
        if (sh.op <= 0 || sh.life > sh.maxLife) { shooters.splice(i, 1); continue; }
        _tail.x = sh.x - sh.vx * sh.len / sh.speed; _tail.y = sh.y - sh.vy * sh.len / sh.speed;
        ctx.strokeStyle = getShooterGradient(sh, _tail);
        ctx.lineWidth = 1.2 * dpr;
        ctx.beginPath(); ctx.moveTo(_tail.x, _tail.y); ctx.lineTo(sh.x, sh.y); ctx.stroke();
      }
      if (fadingOut && starsVisible === 0 && shooters.length === 0) { burstStartTs = null; raf = null; return; }
      raf = requestAnimationFrame(draw);
    };

    resize();
    window.addEventListener('resize', resize, { passive: true });
    const startScreen = byId('start-screen');
    const obs = new MutationObserver(() => {
      if (startScreen.classList.contains('dismissing') && !startScreen.classList.contains('gone')) {
        canvas.style.transition = `opacity ${Shared.DUR_XL / 1000}s ${Shared.EASE_STD}`; canvas.style.opacity = '0';
      }
      if (!startScreen.classList.contains('gone')) return;
      if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
      window.removeEventListener('resize', resize); obs.disconnect();
    });
    obs.observe(startScreen, { attributes: true, attributeFilter: ['class'] });
    return burst;
  };

  const initEyebrowTypeOn = () => {
    const el = byId('start-eyebrow');
    if (!el) return;
    const chars = [...el.textContent.trim()];
    el.textContent = '';
    const spans = chars.map(ch => {
      const s = document.createElement('span');
      s.textContent = ch; el.appendChild(s); return s;
    });
    setTimeout(() => {
      el.style.opacity = '1';
      const n = spans.length;
      spans.forEach((s, i) => {
        const u = i / (n - 1), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        setTimeout(() => s.classList.add('vis'), e * Shared.DUR_XL + i * 8);
      });
    }, Shared.DUR_MD);
  };

  const initNameBurst = burst => {
    const nameEntranceEl = byId('start-name-main');
    const triggerBurst = () => {
      nameEntranceEl.classList.remove('tapped'); void nameEntranceEl.offsetWidth; nameEntranceEl.classList.add('tapped');
      nameEntranceEl.addEventListener('animationend', () => nameEntranceEl.classList.remove('tapped'), { once: true });
      burst?.();
    };
    nameEntranceEl.addEventListener('pointerdown', triggerBurst);
  };

  const bindLaunch = () => {
    const startScreen = byId('start-screen');
    const startBtn = byId('start-btn');
    const onLaunch = () => {
      startBtn.removeEventListener('click', onLaunch);
      startScreen.classList.add('dismissing');
      setTimeout(() => {
        startScreen.classList.add('gone');
        CountdownPhase.startLoader();
      }, Shared.DUR_LG);
    };
    startBtn.addEventListener('click', onLaunch);
  };

  const init = () => {
    const burst = initCosmos();
    initEyebrowTypeOn();
    initNameBurst(burst);
    bindLaunch();
  };

  return { init };
})();

const CountdownPhase = (() => {
  const { ease, cubicInOut, dom, screen, perlin, byId, MORSE_CODE, BAR_WIDTH, PARTICLE_N, TOTAL_MS,
    SPECIAL_IDX, END_STR, dayAt, particleSpeed, fmtDate, resetDateCache,
    EASE_OUT_BACK, DUR_MD, DUR_LG, DUR_XL, DotParticle } = Shared;

  const SPECIAL_MS = (() => {
    const target = (SPECIAL_IDX + 0.3) / Shared.TOTAL_DAYS;
    let lo = 0, hi = 1;
    for (let i = 0; i < 52; i++) { const mid = (lo + hi) * .5; Shared.journey(mid) < target ? lo = mid : hi = mid; }
    return (lo + hi) * .5 * TOTAL_MS;
  })();

  const state = {
    startTs: 0, loaderRafId: null, noiseOffset: 0, isTransitioning: false,
    transitionPhase: 0, loaderParticles: [],
  };
  const specialDay = { triggered: false, active: false, turbulence: 0, rampTs: 0, rampDur: 0, rampType: 0, rampFrom: 0 };
  const arrival = { triggered: false, beatTs: 0, BEAT_MS: DUR_LG };
  const freeze = { phase: 'none', pinnedAt: 0, pinned: 0, FREEZE: DUR_MD, BLEND: DUR_LG };

  const dipDateDisplay = (midOpacity, opacityEase, onMid) => {
    const el = dom.date;
    el.style.transition = `transform ${DUR_XL / 1000}s ${EASE_OUT_BACK}, opacity ${DUR_LG / 1000}s ${opacityEase}`;
    el.style.transform = 'translateY(-4px)'; el.style.opacity = String(midOpacity);
    setTimeout(() => {
      onMid();
      el.style.transform = 'translateY(0px)'; el.style.opacity = '1';
      setTimeout(() => { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }, DUR_XL);
    }, DUR_MD);
  };

  const hologramState = (elapsed, spd) => {
    const t = elapsed / TOTAL_MS;
    if (t < .06) return 'stable';
    if (t > .86) return 'clear';
    if (spd > 25) return 'warp';
    if (spd > 12) return 'settle';
    return 'stable';
  };

  const effectiveElapsed = re => {
    if (freeze.phase === 'none') return re;
    const s = re - freeze.pinnedAt;
    if (s <= freeze.FREEZE) return freeze.pinned;
    if (s <= freeze.FREEZE + freeze.BLEND) {
      const t = (s - freeze.FREEZE) / freeze.BLEND;
      return freeze.pinned + (s - freeze.FREEZE) + ((re - freeze.FREEZE) - (freeze.pinned + (s - freeze.FREEZE))) * cubicInOut(t);
    }
    return re - freeze.FREEZE;
  };

  const buildMorse = () => {
    const symbols = MORSE_CODE.split('|');
    const totalUnits = symbols.reduce((acc, sym, i) => {
      let u = 0; for (const c of sym) u += c === '•' ? 1.5 : c === '−' ? 3.5 : 0;
      return acc + u + (i < symbols.length - 1 ? 2 : 0);
    }, 0);
    const unit = BAR_WIDTH / totalUnits;
    const build = container => {
      const frag = document.createDocumentFragment();
      for (let si = 0; si < symbols.length; si++) {
        const sym = symbols[si];
        for (let ci = 0; ci < sym.length; ci++) {
          const c = sym[ci];
          if (c !== '•' && c !== '−') continue;
          const el = document.createElement('div');
          el.className = c === '•' ? 'morse-dot' : 'morse-dash';
          el.style.width = (c === '•' ? unit : unit * 3) + 'px';
          if (ci < sym.length - 1 || si < symbols.length - 1) el.style.marginRight = unit * .5 + 'px';
          frag.appendChild(el);
        }
        if (si < symbols.length - 1) {
          const sp = document.createElement('div');
          sp.className = 'morse-gap'; sp.style.width = unit * 2 + 'px'; frag.appendChild(sp);
        }
      }
      container.appendChild(frag);
    };
    build(byId('morse-bg')); build(byId('morse-fg'));
  };

  class LoaderParticle extends DotParticle {
    constructor() {
      super(dom.particles);
      this.speedVar = .92 + Math.random() * .16;
      this.noiseOff = Math.random() * 1000;
      this.pulsePhase = Math.random() * Math.PI * 2;
      this.pulseSpeed = .001 + Math.random() * .0015;
      this.reset();
    }
    reset() {
      this.sx = Math.random() * screen.w; this.sy = Math.random() * screen.h;
      const a = Math.atan2(this.sy - screen.cy, this.sx - screen.cx);
      this.dx = Math.cos(a); this.dy = Math.sin(a);
      this.x = this.sx; this.y = this.sy; this.prog = 0;
      this.size = Math.random() * 2 + .7; this.spd = .0014 + Math.random() * .0008;
      this.rot = a.toFixed(4);
      this.maxDim = Math.max(screen.w, screen.h) * 2.2;
      this.el.style.height = this.size + 'px';
      this._w = null; this._lastOp = -1;
    }
    update(spd) {
      const noise = perlin.noise(state.noiseOffset + this.noiseOff) * .12 + .94;
      this.prog += this.spd * spd * this.speedVar * noise * Shared.clock.k;
      const dist = this.prog * this.maxDim;
      this.x = this.sx + this.dx * dist; this.y = this.sy + this.dy * dist;
      const scale = 1 + this.prog * 3.5, stretch = Math.min(spd * .5, 15);
      this.pulsePhase += this.pulseSpeed * spd * Shared.clock.k;
      let op = .75 + Math.sin(this.pulsePhase) * .06;
      if (spd > 20) op = Math.min(op + Math.min((spd - 20) / 15, 1) * .1, .92);
      if (state.transitionPhase) op *= 1 - ease(state.transitionPhase) * .92;
      if (this.prog > .7) op *= 1 - ease((this.prog - .7) / .3) * .6;
      op = Math.max(op, .06);
      const w = ((this.size * scale * 100 | 0) / 100) + '';
      if (this._w !== w) { this.el.style.width = w + 'px'; this._w = w; }
      this.el.style.transform = `translate(${this.x | 0}px,${this.y | 0}px) rotate(${this.rot}rad) scaleX(${(1 + stretch * 100 | 0) / 100})`;
      const opR = (op * 1000 | 0) / 1000;
      if (this._lastOp !== opR) { this.el.style.opacity = opR; this._lastOp = opR; }
      if (this.prog >= 2.5 || this.x < -600 || this.x > screen.w + 600 || this.y < -600 || this.y > screen.h + 600) this.reset();
    }
  }

  const loaderTick = ts => {
    Shared.clock.k = Shared.tickK(state, ts);
    const re = ts - state.startTs;
    const elapsed = effectiveElapsed(re);
    if (!specialDay.triggered && (dayAt(elapsed) | 0) >= SPECIAL_IDX) {
      specialDay.triggered = specialDay.active = true;
      freeze.phase = 'frozen'; freeze.pinnedAt = re; freeze.pinned = SPECIAL_MS; resetDateCache();
      specialDay.rampTs = ts; specialDay.rampDur = DUR_XL; specialDay.rampType = 1; specialDay.rampFrom = 0;
      dipDateDisplay(0.7, 'ease-out', () => {
        dom.date.classList.remove('warp', 'settle'); dom.date.textContent = '27 JAN 2021'; dom.date.classList.add('special');
      });
    }
    if (freeze.phase !== 'none') {
      const s = re - freeze.pinnedAt;
      if (s >= freeze.FREEZE + freeze.BLEND) {
        freeze.phase = 'none';
      } else if (s >= freeze.FREEZE) {
        if (freeze.phase === 'frozen') {
          freeze.phase = 'blending';
          if (specialDay.active) {
            specialDay.active = false;
            specialDay.rampTs = ts; specialDay.rampDur = DUR_XL; specialDay.rampType = -1; specialDay.rampFrom = specialDay.turbulence;
            dipDateDisplay(0.6, 'ease-in-out', () => {
              dom.date.classList.remove('special'); resetDateCache();
            });
          }
        }
      }
    }
    let speedMul = 1;
    if (freeze.phase === 'frozen') {
      speedMul = 0;
    } else if (freeze.phase === 'blending') {
      const bt = (re - freeze.pinnedAt - freeze.FREEZE) / freeze.BLEND;
      speedMul = cubicInOut(bt);
    }
    if (!state.isTransitioning) state.noiseOffset += .008 * speedMul * Shared.clock.k;
    const lp = state.loaderParticles, spd = particleSpeed(elapsed);
    if (specialDay.rampType !== 0) {
      const rt = Math.min((ts - specialDay.rampTs) / specialDay.rampDur, 1);
      specialDay.turbulence = specialDay.rampType > 0 ? ease(rt) : specialDay.rampFrom * (1 - ease(rt));
      if (rt >= 1) specialDay.rampType = 0;
    }
    const tb = specialDay.turbulence;
    const turbSpd = tb > 0 ? spd + tb * (perlin.noise(state.noiseOffset * 3.1) * 28 + 18) : spd;
    for (let i = 0; i < lp.length; i++) lp[i].update(turbSpd);
    if (!specialDay.active && !dom.date.classList.contains('special')) {
      const str = fmtDate(dayAt(elapsed));
      if (dom.date.textContent !== str) dom.date.textContent = str;
      const hs = hologramState(elapsed, spd);
      dom.date.classList.toggle('warp', hs === 'warp');
      dom.date.classList.toggle('settle', hs === 'settle');
    }
    const basePct = Math.min(elapsed / TOTAL_MS, 1) * 100;
    const glitch = tb > 0 ? tb * (perlin.noise(state.noiseOffset * 5.7) - 0.5) * 1.2 : 0;
    const pct = Math.max(0, basePct + glitch).toFixed(2) + '%';
    if (dom.barOverlay.style.width !== pct) dom.barOverlay.style.width = pct;
    const pctNum = parseFloat(pct);
    if (pctNum > 1.5 && pctNum < 99) {
      if (!dom.barCursor._shown) { dom.barCursor._shown = true; dom.barCursor.style.transition = `opacity ${DUR_LG / 1000}s ${Shared.EASE_STD}`; }
      dom.barCursor.style.left = ((pctNum * BAR_WIDTH / 100 - 1) | 0) + 'px';
      dom.barCursor.style.opacity = ((0.55 + Math.sin(ts * 0.006) * 0.25) * 1000 | 0) / 1000 + '';
    } else {
      dom.barCursor.style.opacity = '0';
    }
    if (elapsed >= TOTAL_MS) {
      dom.barOverlay.style.width = '100%'; dom.barCursor.style.opacity = '0';
      if (!arrival.triggered) { arrival.triggered = true; arrival.beatTs = ts; dom.date.textContent = END_STR; dom.date.className = 'arrival'; }
      if (!state.isTransitioning && ts - arrival.beatTs >= arrival.BEAT_MS) { Transition.start(ts); return; }
    }
    state.loaderRafId = requestAnimationFrame(loaderTick);
  };

  const startLoader = () => {
    buildMorse();
    state.startTs = performance.now();
    for (let i = 0; i < PARTICLE_N; i++) state.loaderParticles.push(new LoaderParticle());
    requestAnimationFrame(loaderTick);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      dom.loader.classList.add('loader-active', 'loader-entered');
    }));
  };

  const resumeAfterHidden = () => {
    if (state.startTs && !state.isTransitioning && !state.loaderRafId && !dom.loader.classList.contains('hidden')) {
      state.startTs += performance.now() - state._hiddenAt;
      state.loaderRafId = requestAnimationFrame(loaderTick);
    }
  };
  const pauseForHidden = () => {
    if (state.loaderRafId) { cancelAnimationFrame(state.loaderRafId); state.loaderRafId = null; state._hiddenAt = performance.now(); }
  };
  const teardown = () => {
    if (state.loaderRafId) { cancelAnimationFrame(state.loaderRafId); state.loaderRafId = null; }
    state.loaderParticles.forEach(p => p.destroy()); state.loaderParticles = [];
  };

  return { state, startLoader, resumeAfterHidden, pauseForHidden, teardown };
})();


const Scramble = (() => {
  const { DUR_SM, DUR_MD, DUR_XL, EASE_STD, ease } = Shared;
  const GLYPHS = '·•+×01<>:;_%#', TICK_MIN = 45, TICK_VAR = 35, JITTER = 76, ONSET = 100;

    if (settled) { orb.yaw = orb.tyaw; orb.pitch = orb.tpitch; orb.zoom = orb.tzoom; }
    applyOrbit();
    if (settled) { orb.raf = null; orb.last = 0; return; }
    orb.raf = requestAnimationFrame(orbitStep);
  };
  const kickOrbit = () => { orb.raf ??= requestAnimationFrame(orbitStep); };

  const orbitDrag = e => {
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < MOVE_TOL) return;
      drag.moved = true; drag.lx = e.clientX; drag.ly = e.clientY; cancelHold();
      hintEl.classList.add('off'); document.body.classList.add('orbiting');
      return;
    }
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly; drag.lx = e.clientX; drag.ly = e.clientY;
    orb.tyaw = Math.max(-YAW_MAX, Math.min(YAW_MAX, orb.tyaw + dx * DRAG_GAIN));
    orb.tpitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, orb.tpitch - dy * DRAG_GAIN));
    kickOrbit();
  };


  const STAR_SEG = (() => {
    const n = STAR_INFO.length, antares = STAR_INFO.findIndex(s => s.name === 'ANTARES');
    const pool = [...Array(n).keys()].filter(i => i !== THETA_IDX);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
    return STAR_INFO.map((_, s) => s === antares ? THETA_IDX : pool.pop());
  })();

  const syncLink = () => {
    const on = chart && locked && cur !== -1;
    SegLit.set(on ? STAR_SEG[cur] : -1);
  };

  let holdTimer = null;
  const cancelHold = () => { clearTimeout(holdTimer); holdTimer = null; el.hold.classList.remove('on', 'done'); };
  const fireHold = k => {
    holdTimer = null; drag = null; document.body.classList.remove('orbiting');
    el.hold.classList.add('done'); hintEl.classList.add('off');
    const [x, y] = centerOf(k);
    Modal.openSingle(STAR_SEG[k], { ...STAR_INFO[k], color: SCORPIO_STARS[k].color }, x, y);
  };
  const armHold = k => { cancelHold(); retrigger(el.hold, 'on'); holdTimer = setTimeout(fireHold, HOLD_MS, k); };

  const modalBusy = () => modal.open || document.body.classList.contains('modal-open');

  const enterChart = () => {
    chart = state.chartMode = true; document.body.classList.add('chart-mode');
    hintEl.classList.remove('off');
    orb.tzoom = CHART_ZOOM; kickOrbit();
    syncLink(); SegLit.retrack();
  };
  const exitChart = () => {
    if (!chart) return;
    chart = state.chartMode = false; drag = null; document.body.classList.remove('chart-mode', 'orbiting'); release();
    orb.tyaw = orb.tpitch = 0; orb.tzoom = 1; kickOrbit();
    SegLit.retrack();
  };

  document.addEventListener('pointermove', e => {
    if (modalBusy()) return;
    if (drag && chart && e.pointerId === drag.id) orbitDrag(e);
    if (e.pointerType === 'touch' || drag?.moved) return;
    if (!canProbe() || overSeg(e)) { if (shown) release(); return; }
    const idx = nearest(e.clientX, e.clientY, HIT_MOUSE);
    if (idx !== -1) { if (idx !== cur) acquire(idx); return; }
    if (!shown) return;
    const c = centerOf(cur);
    if (locked && c && Math.hypot(e.clientX - c[0], e.clientY - c[1]) < KEEP) return;
    release();
  }, { passive: true });

  document.addEventListener('pointerdown', e => {
    if (modalBusy()) return;
    const touch = e.pointerType === 'touch', hit = touch ? HIT_TOUCH : HIT_MOUSE;
    if (chart) {
      if (e.target.closest?.('#chart-exit')) return;
      const k = nearest(e.clientX, e.clientY, hit);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY, sx: e.clientX, sy: e.clientY, moved: false, tap: k === -1 };
      if (k === -1) return;
      if (k !== cur) acquire(k);
      lockOn(false);
      return armHold(k);
    }
    if (overSeg(e) || !canProbe()) { if (shown) release(); return; }
    const idx = nearest(e.clientX, e.clientY, hit);
    if (idx === -1) { if (shown) release(); return; }
    const enter = allHome();
    if (idx !== cur) acquire(idx);
    lockOn(touch && !enter);
    if (enter) enterChart();
  }, { passive: true });

  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    cancelHold();
    const d = drag; drag = null; document.body.classList.remove('orbiting');
    if (chart && d.tap && !d.moved && e.type === 'pointerup') release();
  };
  document.addEventListener('pointerup', endDrag, { passive: true });
  document.addEventListener('pointercancel', endDrag, { passive: true });

  byId('chart-exit').addEventListener('click', exitChart);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && chart && !modal.open && !e.defaultPrevented) exitChart(); });
  document.addEventListener('contextmenu', e => { if (chart) e.preventDefault(); });

  document.documentElement.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch' && shown) release(); });
  window.addEventListener('blur', () => { if (shown) release(); });

  return { release };
})();

(() => {
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { Shared.screen.w = window.innerWidth; Shared.screen.h = window.innerHeight; }, Shared.DUR_XS);
  }, { passive: true });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      StarProbe.release();
      SplashPhase.pauseLoop();
      CountdownPhase.pauseForHidden();
      return;
    }
    SplashPhase.resumeLoop();
    CountdownPhase.resumeAfterHidden();
  });
})();

document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', StartPhase.init) : StartPhase.init();
</script>
</body>
</html>
